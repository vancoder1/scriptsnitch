name: Bug report
description: scriptsnitch did something wrong, such as a false alarm, a missed change or a crash.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please don't report security vulnerabilities here; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What scriptsnitch reported or did, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: Finding keys and report
      description: The finding keys involved, and the relevant part of report.json or the job summary. Remove anything private.
  - type: input
    id: version
    attributes:
      label: Version
      description: The tag or commit you use, for example v1.0.0.
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version and runner
      description: From the snapshot (run.chrome) and the runner image.
