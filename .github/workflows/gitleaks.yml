name: gitleaks

# Secret-leak gate. Scans only the new commits in each push or pull request.
# scriptsnitch needs no secret of its own, so a key in a commit is always a
# mistake. Uses the gitleaks binary directly, checksum-verified, as
# actionlint.yml does for actionlint.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Bumping: change both together, from the release's gitleaks_<version>_checksums.txt.
env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: Scan changes for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tgz
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict
          tar -xzf gitleaks.tgz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Determine commit range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # A new branch: its last commit, or the whole history if it has only one.
            if git rev-parse -q --verify "$HEAD_SHA~1" >/dev/null; then range="$HEAD_SHA~1..$HEAD_SHA"; else range="$HEAD_SHA"; fi
          else
            range="$PUSH_BEFORE..$HEAD_SHA"
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Scan new commits
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: gitleaks git . --redact --exit-code 1 --log-opts="$RANGE --no-merges"
