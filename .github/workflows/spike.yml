name: Spike (temporary)
on: push
permissions:
  contents: read
jobs:
  chrome:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Launch Chrome over a pipe with the sandbox on
        shell: bash
        run: |
          cat > spike.mjs <<'JS'
          import { spawn } from 'node:child_process';
          import { existsSync, mkdtempSync } from 'node:fs';
          import { tmpdir } from 'node:os'; import { join } from 'node:path';
          const cands = { linux: ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/opt/google/chrome/chrome','/usr/bin/chromium','/usr/bin/chromium-browser'],
            win32: ['C:\Program Files\Google\Chrome\Application\chrome.exe','C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'],
            darwin: ['/Applications/Google Chrome.app/Contents/MacOS/Google Chrome','/Applications/Chromium.app/Contents/MacOS/Chromium'] }[process.platform];
          console.log('candidates present:', cands.map(c => `${c}=${existsSync(c)}`).join(' | '));
          const exe = cands.find(existsSync);
          const env = {}; for (const k of ['PATH','Path','HOME','TMP','TEMP','TMPDIR','LANG','SystemRoot','SYSTEMROOT']) if (process.env[k]) env[k] = process.env[k];
          const child = spawn(exe, ['--headless','--remote-debugging-pipe',`--user-data-dir=${mkdtempSync(join(tmpdir(),'s-'))}`,'--no-first-run','--disable-blink-features=AutomationControlled','about:blank'], { stdio: ['ignore','ignore','pipe','pipe','pipe'], env });
          let err=''; child.stdio[2].on('data', d => err += d);
          child.stdio[3].write(JSON.stringify({ id: 1, method: 'Browser.getVersion' }) + '\0');
          let buf=''; const t = setTimeout(() => { console.log('TIMEOUT; stderr:', err.slice(0, 2000)); process.exit(1); }, 15000);
          child.stdio[4].on('data', d => { buf += d; const i = buf.indexOf('\0'); if (i >= 0) { clearTimeout(t); console.log('exe:', exe); console.log('version:', JSON.parse(buf.slice(0,i)).result.product); console.log('sandbox warnings:', /sandbox/i.test(err) ? err.split('\n').filter(l=>/sandbox/i.test(l)).join(' / ') : 'none'); child.kill(); process.exit(0); } });
          child.on('exit', (c) => { console.log('exited', c, 'stderr:', err.slice(0, 2000)); process.exit(1); });
          JS
          node spike.mjs
